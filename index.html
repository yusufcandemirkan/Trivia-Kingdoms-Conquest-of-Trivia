<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trivia Kingdoms: Global Conquest</title>
  <style>
    :root {
      --bg-dark: #070d19;
      --card-bg: #0f172a;
      --panel-border: #1e293b;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
      --player-color: #2563eb;
      --bot1-color: #dc2626;
      --bot2-color: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --ocean-color: #081326;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, var(--bg-dark) 85%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1050px;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--panel-border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      background: rgba(7, 13, 25, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
    }

    .btn-ad {
      background: linear-gradient(135deg, #10b981, #047857);
      color: white;
      border: 1px solid #34d399;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn-ad:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }

    main {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 16px;
    }

    .map-container {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      border: 1px solid var(--panel-border);
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 6px;
    }

    .map-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .audio-toggle {
      background: none;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    svg {
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--ocean-color);
      border-radius: 14px;
      border: 1px solid #1e293b;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.7);
    }

    .continent {
      cursor: pointer;
      stroke: #070d19;
      stroke-width: 1.5;
      stroke-linejoin: round;
      transition: fill 0.4s ease, filter 0.25s ease, transform 0.2s ease;
    }

    .continent:hover {
      filter: brightness(1.3) drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
    }

    .continent-label {
      pointer-events: none;
      font-size: 13px;
      font-weight: 800;
      fill: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      letter-spacing: 0.5px;
    }

    /* Modal ve Katmanlar */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 16, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 26px;
      width: 100%;
      max-width: 490px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 25px 50px rgba(0,0,0,0.85);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .wheel-container {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 8px auto;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--accent-gold);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
      transition: transform 3.5s cubic-bezier(0.12, 0.95, 0.2, 1);
      background: conic-gradient(
        #ef4444 0deg 72deg,
        #3b82f6 72deg 144deg,
        #10b981 144deg 216deg,
        #f59e0b 216deg 288deg,
        #8b5cf6 288deg 360deg
      );
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      z-index: 10;
    }

    .timer-bar {
      width: 100%;
      height: 8px;
      background: #070d18;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 1s linear;
    }

    .category-tag {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.45;
      min-height: 52px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      background: rgba(7, 13, 24, 0.6);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #1e293b;
      border-color: var(--accent-blue);
      transform: translateX(4px);
    }

    .option-btn.correct { background: #059669 !important; border-color: #34d399 !important; }
    .option-btn.wrong { background: #dc2626 !important; border-color: #f87171 !important; }

    .guess-input-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
    }

    .guess-input {
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
      background: #070d18;
      border: 2px solid var(--panel-border);
      border-radius: 10px;
      color: white;
      text-align: center;
      width: 150px;
      outline: none;
    }

    .btn-submit {
      background: var(--accent-blue);
      color: #070d18;
      font-weight: 800;
      font-size: 15px;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
    }

    .ad-card {
      background: #020617;
      border: 2px dashed #f59e0b;
      padding: 35px 20px;
    }

    .ad-timer {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-gold);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="stat-badge">
      <span>🎫 Sefer Biletleri:</span>
      <span id="ticketCount" style="color: var(--accent-blue);">3/3</span>
    </div>
    <button class="btn-ad" onclick="openRewardedAd()">
      <span>▶ Reklam İzle (+1 Bilet)</span>
    </button>
    <div class="stat-badge">
      <span>🌐 Mavi Kıtalar:</span>
      <span id="territoryCount" style="color: var(--accent-gold);">2/6</span>
    </div>
  </header>

  <main>
    <div class="map-container">
      <div class="map-header">
        <div class="map-title">Küresel Harita: Fethetmek İstediğiniz Kıtaya Tıklayın</div>
        <button class="audio-toggle" onclick="toggleAudio()" id="audioBtn">🔊 Ses: Açık</button>
      </div>

      <!-- Gerçek Dünya Haritası Silüeti (SVG Paths) -->
      <svg viewBox="0 0 1000 520" id="gameMap">
        <!-- Izgara Çizgileri -->
        <line x1="0" y1="260" x2="1000" y2="260" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4" />
        <line x1="500" y1="0" x2="500" y2="520" stroke="rgba(255,255,255,0.04)" stroke-dasharray="4" />

        <!-- 1. KUZEY AMERİKA & GRÖNLAND (Kırmızı) -->
        <g id="c1" class="continent" fill="#dc2626" onclick="handleContinentClick(1)">
          <!-- Grönland -->
          <path d="M280,35 Q340,30 360,70 Q370,120 320,135 Q290,110 270,70 Z" />
          <!-- Kuzey Amerika Ana Karası + Kanada Adaları -->
          <path d="M40,90 Q90,55 170,60 Q210,50 250,90 Q220,135 240,180 Q220,230 180,260 Q170,270 145,225 Q135,170 75,150 Q45,130 40,90 Z" />
          <text x="150" y="150" text-anchor="middle" class="continent-label">Kuzey Amerika</text>
        </g>

        <!-- 2. GÜNEY AMERİKA (Kırmızı) -->
        <g id="c2" class="continent" fill="#dc2626" onclick="handleContinentClick(2)">
          <path d="M195,270 Q240,265 295,310 Q340,360 275,440 Q240,490 220,500 Q205,430 195,350 Q180,310 195,270 Z" />
          <text x="245" y="375" text-anchor="middle" class="continent-label">Güney Amerika</text>
        </g>

        <!-- 3. AVRUPA (Oyuncu - Mavi) -->
        <g id="c3" class="continent" fill="#2563eb" onclick="handleContinentClick(3)">
          <!-- İskandinavya + Batı & Doğu Avrupa + Akdeniz Havzası -->
          <path d="M410,120 Q440,70 470,60 Q485,90 465,130 Q510,115 540,135 Q530,195 480,210 Q435,215 410,185 Q390,150 410,120 Z" />
          <!-- Britanya -->
          <path d="M405,100 Q420,95 425,120 Q410,130 400,115 Z" />
          <text x="465" y="155" text-anchor="middle" class="continent-label">Avrupa</text>
        </g>

        <!-- 4. AFRİKA (Yeşil) -->
        <g id="c4" class="continent" fill="#059669" onclick="handleContinentClick(4)">
          <!-- Afrika Kıtası + Madagaskar -->
          <path d="M405,225 Q495,215 535,260 Q575,315 520,380 Q510,430 495,435 Q450,420 440,340 Q400,310 395,265 Z" />
          <path d="M570,360 Q585,355 580,390 Q565,395 570,360 Z" />
          <text x="470" y="325" text-anchor="middle" class="continent-label">Afrika</text>
        </g>

        <!-- 5. ASYA & ORTA DOĞU (Oyuncu - Mavi) -->
        <g id="c5" class="continent" fill="#2563eb" onclick="handleContinentClick(5)">
          <!-- Rusya/Sibirya + Orta Doğu + Hindistan + Doğu Asya & Japonya -->
          <path d="M545,130 Q630,50 820,60 Q890,90 880,165 Q830,195 785,250 Q750,310 700,285 Q670,230 635,230 Q595,285 570,270 Q540,240 550,180 Z" />
          <!-- Japonya & Güneydoğu Adaları -->
          <path d="M855,160 Q875,170 865,210 Q850,200 855,160 Z" />
          <path d="M740,330 Q780,325 800,355 Q760,370 735,345 Z" />
          <text x="700" y="165" text-anchor="middle" class="continent-label">Asya</text>
        </g>

        <!-- 6. OKYANUSYA / AVUSTRALYA (Yeşil) -->
        <g id="c6" class="continent" fill="#059669" onclick="handleContinentClick(6)">
          <!-- Avustralya Ana Karası + Yeni Zelanda -->
          <path d="M780,360 Q860,340 890,395 Q875,445 810,440 Q770,420 780,360 Z" />
          <path d="M930,430 Q945,435 935,465 Q920,455 930,430 Z" />
          <text x="835" y="405" text-anchor="middle" class="continent-label">Okyanusya</text>
        </g>
      </svg>
    </div>
  </main>

  <!-- Çark Modal -->
  <div class="modal-overlay" id="wheelModal">
    <div class="modal-card">
      <h3 style="font-size: 20px; font-weight: 800;">Kıta Seferi Başlıyor</h3>
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel"></div>
      </div>
      <p style="color: var(--text-muted); font-size: 14px;">Kader çarkı dönüyor...</p>
    </div>
  </div>

  <!-- Soru Modal -->
  <div class="modal-overlay" id="triviaModal">
    <div class="modal-card">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="category-tag" id="categoryLabel">Tarih</div>
      <div class="question-text" id="questionText">Soru yükleniyor...</div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </div>

  <!-- Kuşatma Tahmin Modal -->
  <div class="modal-overlay" id="guessModal">
    <div class="modal-card">
      <div class="category-tag">Kıta Kuşatması: En Yakın Tahmin</div>
      <div class="question-text" id="guessQuestionText">Soru...</div>
      <div class="guess-input-group">
        <input type="number" id="guessInput" class="guess-input" placeholder="Yıl / Sayı">
        <button class="btn-submit" onclick="submitGuess()">Kuşat</button>
      </div>
    </div>
  </div>

  <!-- Reklam Simülasyonu -->
  <div class="modal-overlay" id="adModal">
    <div class="modal-card ad-card">
      <h3 style="color: #f59e0b;">ÖDÜLLÜ REKLAM SİMÜLASYONU</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 6px;">
        (CrazyGames / AdinPlay SDK ile dolar kazandırır)
      </p>
      <div class="ad-timer" id="adTimer">5</div>
    </div>
  </div>

  <script>
    /* Web Audio API Ses Motoru */
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? '🔊 Ses: Açık' : '🔇 Ses: Kapalı';
    }

    function playClickSound() {
      if (!audioEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(460, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSuccessSound() {
      if (!audioEnabled) return;
      initAudio();
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.2);
      });
    }

    function playFailSound() {
      if (!audioEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playConquestSound() {
      if (!audioEnabled) return;
      initAudio();
      [440, 554.37, 659.25, 880].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.12);
        osc.stop(audioCtx.currentTime + idx * 0.12 + 0.4);
      });
    }

    /* Oyun Verisi & Durumu */
    let tickets = 3;
    let selectedContinentId = null;
    let timerInterval = null;
    let timeLeft = 10;

    // 6 Ana Kıta: 3 (Avrupa) ve 5 (Asya) Oyuncuda
    const continentOwners = {
      1: 'bot1',   // K. Amerika
      2: 'bot1',   // G. Amerika
      3: 'player', // Avrupa
      4: 'bot2',   // Afrika
      5: 'player', // Asya
      6: 'bot2'    // Okyanusya
    };

    const triviaPool = [
      { category: 'Tarih', question: 'Kıbrıs hangi yılda Osmanlı yönetimine geçmiştir?', options: ['1453', '1571', '1683', '1492'], answer: 1 },
      { category: 'Tarih', question: 'Çanakkale Boğazı Deniz Zaferi hangi tarihte kazanılmıştır?', options: ['18 Mart 1915', '29 Ekim 1923', '30 Ağustos 1922', '19 Mayıs 1919'], answer: 0 },
      { category: 'Coğrafya', question: 'Yüzölçümü bakımından dünyanın en büyük kıtası hangisidir?', options: ['Afrika', 'Asya', 'Kuzey Amerika', 'Avrupa'], answer: 1 },
      { category: 'Coğrafya', question: 'Dünyanın en uzun sıradağlar zinciri hangisidir?', options: ['Himalayalar', 'And Dağları', 'Alpler', 'Kayalık Dağlar'], answer: 1 },
      { category: 'Bilim', question: 'Periyodik tabloda "Au" sembolü hangi elementi temsil eder?', options: ['Gümüş', 'Altın', 'Bakır', 'Demir'], answer: 1 },
      { category: 'Spor', question: 'FIFA Dünya Kupası\'nı en çok kazanan ülke hangisidir?', options: ['Almanya', 'İtalya', 'Brezilya', 'Arjantin'], answer: 2 }
    ];

    const guessPool = [
      { question: 'Ay\'a ilk insan hangi yılda ayak basmıştır?', answer: 1969 },
      { question: 'Titanik gemisi hangi yılda batmıştır?', answer: 1912 },
      { question: 'İstanbul hangi yılda fethedilmiştir?', answer: 1453 },
      { question: 'Amerika kıtası Kristof Kolomb tarafından hangi yılda keşfedilmiştir?', answer: 1492 }
    ];

    function handleContinentClick(id) {
      playClickSound();
      if (continentOwners[id] === 'player') {
        alert('Bu kıta zaten sizin hakimiyetinizde!');
        return;
      }

      if (tickets <= 0) {
        alert('Sefer biletiniz kalmadı! Reklam izleyerek yeni bilet alabilirsiniz.');
        return;
      }

      selectedContinentId = id;
      tickets--;
      updateUI();
      startConquestFlow();
    }

    function startConquestFlow() {
      const wheelModal = document.getElementById('wheelModal');
      const wheel = document.getElementById('wheel');
      wheelModal.style.display = 'flex';

      const randomDeg = 1440 + Math.floor(Math.random() * 360);
      wheel.style.transform = `rotate(${randomDeg}deg)`;

      setTimeout(() => {
        wheelModal.style.display = 'none';
        wheel.style.transform = 'rotate(0deg)';
        if (Math.random() > 0.4) {
          openTriviaModal();
        } else {
          openGuessModal();
        }
      }, 3500);
    }

    function openTriviaModal() {
      const modal = document.getElementById('triviaModal');
      const randomQ = triviaPool[Math.floor(Math.random() * triviaPool.length)];
      
      document.getElementById('categoryLabel').innerText = randomQ.category;
      document.getElementById('questionText').innerText = randomQ.question;
      
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      randomQ.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(btn, index === randomQ.answer);
        grid.appendChild(btn);
      });

      modal.style.display = 'flex';
      startTimer(() => {
        playFailSound();
        alert('Süre tükendi! Kuşatma püskürtüldü.');
        modal.style.display = 'none';
      });
    }

    function selectOption(button, isCorrect) {
      clearInterval(timerInterval);
      if (isCorrect) {
        playSuccessSound();
        button.classList.add('correct');
        setTimeout(() => {
          conquerContinent(selectedContinentId);
          document.getElementById('triviaModal').style.display = 'none';
        }, 900);
      } else {
        playFailSound();
        button.classList.add('wrong');
        setTimeout(() => {
          alert('Yanlış cevap! Kıta savunması galip geldi.');
          document.getElementById('triviaModal').style.display = 'none';
        }, 900);
      }
    }

    let currentGuessQ = null;
    function openGuessModal() {
      currentGuessQ = guessPool[Math.floor(Math.random() * guessPool.length)];
      document.getElementById('guessQuestionText').innerText = currentGuessQ.question;
      document.getElementById('guessInput').value = '';
      document.getElementById('guessModal').style.display = 'flex';
    }

    function submitGuess() {
      playClickSound();
      const userVal = parseInt(document.getElementById('guessInput').value);
      if (isNaN(userVal)) return;

      const botOffset = (Math.floor(Math.random() * 25) - 12);
      const botVal = currentGuessQ.answer + (botOffset === 0 ? 6 : botOffset);
      const userDiff = Math.abs(userVal - currentGuessQ.answer);
      const botDiff = Math.abs(botVal - currentGuessQ.answer);

      let msg = `Gerçek Tarih: ${currentGuessQ.answer}\nSenin Tahminin: ${userVal}\nSavunan Krallık: ${botVal}\n\n`;

      if (userDiff <= botDiff) {
        playSuccessSound();
        msg += 'Daha yakın tahmin ettiniz! Kıta fethedildi!';
        alert(msg);
        conquerContinent(selectedContinentId);
      } else {
        playFailSound();
        msg += 'Düşman daha yakın tahmin yaptı. Kuşatma başarısız!';
        alert(msg);
      }
      document.getElementById('guessModal').style.display = 'none';
    }

    function conquerContinent(id) {
      playConquestSound();
      continentOwners[id] = 'player';
      const el = document.getElementById('c' + id);
      el.setAttribute('fill', '#2563eb');
      updateUI();
      checkWinCondition();
    }

    function startTimer(onTimeout) {
      clearInterval(timerInterval);
      timeLeft = 10;
      const fill = document.getElementById('timerFill');
      fill.style.width = '100%';

      timerInterval = setInterval(() => {
        timeLeft--;
        fill.style.width = (timeLeft * 10) + '%';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          onTimeout();
        }
      }, 1000);
    }

    function openRewardedAd() {
      playClickSound();
      const adModal = document.getElementById('adModal');
      const timerEl = document.getElementById('adTimer');
      let countdown = 5;
      
      adModal.style.display = 'flex';
      timerEl.innerText = countdown;

      const adInterval = setInterval(() => {
        countdown--;
        timerEl.innerText = countdown;
        if (countdown <= 0) {
          clearInterval(adInterval);
          adModal.style.display = 'none';
          tickets = Math.min(tickets + 1, 5);
          updateUI();
          playSuccessSound();
          alert('Ödül Teslim Edildi: +1 Bilet krallığınıza eklendi!');
        }
      }, 1000);
    }

    function updateUI() {
      document.getElementById('ticketCount').innerText = `${tickets}/3`;
      let count = 0;
      for (let k in continentOwners) {
        if (continentOwners[k] === 'player') count++;
      }
      document.getElementById('territoryCount').innerText = `${count}/6`;
    }

    function checkWinCondition() {
      const allPlayer = Object.values(continentOwners).every(v => v === 'player');
      if (allPlayer) {
        playConquestSound();
        alert('KÜRESEL ZAFER! Bütün dünyayı fethettiniz ve tek cihan hükümdarı oldunuz!');
      }
    }
  </script>
</body>
</html>

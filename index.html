<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trivia Kingdoms: Global Conquest</title>
  <style>
    :root {
      --bg-dark: #070d18;
      --card-bg: #0f172a;
      --panel-border: #1e293b;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
      --player-color: #2563eb;
      --bot1-color: #dc2626;
      --bot2-color: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --ocean-color: #09152b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #1e293b 0%, var(--bg-dark) 90%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1400px;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--panel-border);
      box-shadow: 0 4px 25px rgba(0,0,0,0.6);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      background: rgba(7, 13, 25, 0.75);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
    }

    .btn-ad {
      background: linear-gradient(135deg, #10b981, #047857);
      color: white;
      border: 1px solid #34d399;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.35);
      transition: all 0.2s;
    }
    .btn-ad:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(16, 185, 129, 0.55); }

    main {
      width: 100%;
      max-width: 1500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 16px;
    }

    .map-container {
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
      border: 1px solid var(--panel-border);
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 0 8px;
    }

    .map-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .audio-toggle {
      background: rgba(7, 13, 25, 0.6);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    /* 2 Kat Büyütülmüş Ultra Geniş SVG Harita Alanı */
    .svg-scroll-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      border: 1px solid #1e293b;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      background: var(--ocean-color);
    }

    svg#gameMap {
      width: 100%;
      min-width: 1200px; /* Küçük ekranlarda kaydırılabilir minimum genişlik */
      height: auto;
      display: block;
    }

    .continent {
      cursor: pointer;
      transition: filter 0.25s ease, opacity 0.25s ease;
    }

    .continent path {
      stroke: #060c18;
      stroke-width: 1.4;
      stroke-linejoin: round;
      fill: inherit;
    }

    .continent:hover {
      filter: brightness(1.35) drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
    }

    .continent-label {
      pointer-events: none;
      font-size: 20px;
      font-weight: 900;
      fill: #ffffff;
      text-shadow: 0 3px 8px rgba(0,0,0,0.95);
      letter-spacing: 1px;
    }

    /* Modallar */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 16, 0.9);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 520px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .wheel-container {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 10px auto;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid var(--accent-gold);
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
      transition: transform 3.5s cubic-bezier(0.12, 0.95, 0.2, 1);
      background: conic-gradient(
        #ef4444 0deg 72deg,
        #3b82f6 72deg 144deg,
        #10b981 144deg 216deg,
        #f59e0b 216deg 288deg,
        #8b5cf6 288deg 360deg
      );
    }

    .wheel-pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #ffffff;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.6));
      z-index: 10;
    }

    .timer-bar {
      width: 100%;
      height: 9px;
      background: #070d18;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 1s linear;
    }

    .category-tag {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .question-text {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
      min-height: 55px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-btn {
      background: rgba(7, 13, 24, 0.7);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #1e293b;
      border-color: var(--accent-blue);
      transform: translateX(4px);
    }

    .option-btn.correct { background: #059669 !important; border-color: #34d399 !important; }
    .option-btn.wrong { background: #dc2626 !important; border-color: #f87171 !important; }

    .guess-input-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
    }

    .guess-input {
      padding: 14px 20px;
      font-size: 20px;
      font-weight: bold;
      background: #070d18;
      border: 2px solid var(--panel-border);
      border-radius: 12px;
      color: white;
      text-align: center;
      width: 160px;
      outline: none;
    }

    .btn-submit {
      background: var(--accent-blue);
      color: #070d18;
      font-weight: 800;
      font-size: 16px;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
    }

    .ad-card {
      background: #020617;
      border: 2px dashed #f59e0b;
      padding: 40px 24px;
    }

    .ad-timer {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent-gold);
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="stat-badge">
      <span>🎫 Sefer Biletleri:</span>
      <span id="ticketCount" style="color: var(--accent-blue);">3/3</span>
    </div>
    <button class="btn-ad" onclick="openRewardedAd()">
      <span>▶ Reklam İzle (+1 Bilet)</span>
    </button>
    <div class="stat-badge">
      <span>🌐 Hakimiyet:</span>
      <span id="territoryCount" style="color: var(--accent-gold);">2/6 Kıta</span>
    </div>
  </header>

  <main>
    <div class="map-container">
      <div class="map-header">
        <div class="map-title">Küresel Harp Haritası: Hedef Kıtaya Tıklayarak Fetih Başlatın</div>
        <button class="audio-toggle" onclick="toggleAudio()" id="audioBtn">🔊 Ses: Açık</button>
      </div>

      <!-- 2 KAT BÜYÜTÜLMÜŞ DETAYLI DÜNYA HARİTASI (2000 x 1000) -->
      <div class="svg-scroll-wrapper">
        <svg viewBox="0 0 2000 1000" id="gameMap">
          <!-- Meridyen ve Paralel Çizgileri -->
          <line x1="0" y1="500" x2="2000" y2="500" stroke="rgba(255,255,255,0.05)" stroke-dasharray="6" />
          <line x1="1000" y1="0" x2="1000" y2="1000" stroke="rgba(255,255,255,0.05)" stroke-dasharray="6" />

          <!-- 1. KUZEY AMERİKA & GRÖNLAND (Kırmızı) -->
          <g id="c1" class="continent" fill="#dc2626" onclick="handleContinentClick(1)">
            <!-- Grönland -->
            <path d="M570,70 C630,55 700,105 710,170 C715,225 660,270 610,260 C560,250 540,190 550,120 Z" />
            <!-- Kanada Arktik Adaları -->
            <path d="M375,80 C420,70 470,90 460,130 C430,150 380,130 375,80 Z" />
            <path d="M260,90 C310,80 340,110 310,140 C280,150 250,130 260,90 Z" />
            <!-- Alaska & Kanada & ABD & Meksika -->
            <path d="M90,165 C180,95 310,105 430,95 C520,135 470,225 500,295 C520,365 475,445 390,485 C360,505 330,535 305,455 C285,365 205,325 145,285 C95,255 70,215 90,165 Z" />
            <!-- Florida & Karayip Adaları / Küba / Hispanyola -->
            <path d="M435,470 C475,460 495,480 465,495 Z" />
            <path d="M480,500 C510,495 530,515 500,525 Z" />
            <text x="310" y="285" text-anchor="middle" class="continent-label">Kuzey Amerika</text>
          </g>

          <!-- 2. GÜNEY AMERİKA (Kırmızı) -->
          <g id="c2" class="continent" fill="#dc2626" onclick="handleContinentClick(2)">
            <!-- Kolombiya, Brezilya Çıkıntısı, Amazon, Arjantin & Şili -->
            <path d="M385,525 C465,505 565,585 605,665 C645,765 555,875 495,955 C465,985 435,995 425,925 C415,835 385,705 355,625 C345,565 365,535 385,525 Z" />
            <!-- Falkland Adaları -->
            <circle cx="505" cy="965" r="7" />
            <text x="485" y="745" text-anchor="middle" class="continent-label">Güney Amerika</text>
          </g>

          <!-- 3. AVRUPA (Oyuncu - Mavi) -->
          <g id="c3" class="continent" fill="#2563eb" onclick="handleContinentClick(3)">
            <!-- İskandinav Yarımadası & Fiyortlar -->
            <path d="M880,115 C925,105 965,145 945,225 C925,255 895,255 875,205 C865,155 875,125 880,115 Z" />
            <!-- Britanya & İskoçya -->
            <path d="M795,185 C825,175 835,215 815,245 C785,255 785,205 795,185 Z" />
            <!-- İrlanda -->
            <path d="M765,205 C785,195 785,225 775,235 Z" />
            <!-- İzlanda -->
            <path d="M715,105 C745,95 755,125 735,140 C715,140 705,120 715,105 Z" />
            <!-- Kıta Avrupası: İberik, Fransa, Almanya, Polonya, İtalya, Balkanlar -->
            <path d="M805,285 C865,255 935,265 1005,265 C1035,325 975,385 935,405 C885,425 845,415 805,365 C775,335 785,295 805,285 Z" />
            <!-- İtalya Çizmesi & Mora -->
            <path d="M885,375 L905,445 L885,455 Z" />
            <text x="905" y="315" text-anchor="middle" class="continent-label">Avrupa</text>
          </g>

          <!-- 4. AFRİKA (Yeşil) -->
          <g id="c4" class="continent" fill="#059669" onclick="handleContinentClick(4)">
            <!-- Kuzey Sahra, Batı Afrika, Kongo Havzası, Güney Afrika Boynuzu -->
            <path d="M805,445 C965,415 1045,485 1065,555 C1095,655 1025,785 985,865 C945,885 895,835 875,705 C815,665 775,565 785,505 C785,465 795,445 805,445 Z" />
            <!-- Madagaskar -->
            <path d="M1125,715 C1145,705 1155,765 1135,805 C1115,805 1110,745 1125,715 Z" />
            <text x="925" y="645" text-anchor="middle" class="continent-label">Afrika</text>
          </g>

          <!-- 5. ASYA & SİBİRYA (Oyuncu - Mavi) -->
          <g id="c5" class="continent" fill="#2563eb" onclick="handleContinentClick(5)">
            <!-- Rusya, Sibirya, Orta Asya, Arap Yarımadası, Hindistan, Çin -->
            <path d="M1015,265 C1155,115 1515,95 1735,145 C1785,205 1735,315 1655,375 C1565,465 1535,575 1415,585 C1345,585 1295,475 1245,455 C1175,545 1125,535 1075,465 C1025,445 995,335 1015,265 Z" />
            <!-- Japon Takımadaları -->
            <path d="M1695,305 C1725,295 1735,365 1715,415 C1695,415 1685,345 1695,305 Z" />
            <!-- Sri Lanka -->
            <circle cx="1325" cy="625" r="8" />
            <!-- Güneydoğu Asya & Endonezya Adaları -->
            <path d="M1475,635 C1525,625 1555,665 1515,685 Z" />
            <path d="M1555,645 C1605,635 1625,675 1585,695 Z" />
            <text x="1375" y="325" text-anchor="middle" class="continent-label">Asya</text>
          </g>

          <!-- 6. OKYANUSYA / AVUSTRALYA (Yeşil) -->
          <g id="c6" class="continent" fill="#059669" onclick="handleContinentClick(6)">
            <!-- Avustralya Kıtası -->
            <path d="M1545,715 C1665,665 1765,735 1755,825 C1735,895 1625,905 1555,855 C1515,815 1515,755 1545,715 Z" />
            <!-- Yeni Zelanda -->
            <path d="M1835,855 C1865,845 1855,905 1835,925 Z" />
            <path d="M1855,925 C1875,915 1865,965 1845,975 Z" />
            <!-- Tazmanya -->
            <circle cx="1685,915" r="9" />
            <text x="1655,805" text-anchor="middle" class="continent-label">Okyanusya</text>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <!-- Çark Modal -->
  <div class="modal-overlay" id="wheelModal">
    <div class="modal-card">
      <h3 style="font-size: 22px; font-weight: 800;">Kıta Seferi Başlıyor</h3>
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel"></div>
      </div>
      <p style="color: var(--text-muted); font-size: 15px;">Kader çarkı dönüyor...</p>
    </div>
  </div>

  <!-- Soru Modal -->
  <div class="modal-overlay" id="triviaModal">
    <div class="modal-card">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="category-tag" id="categoryLabel">Tarih</div>
      <div class="question-text" id="questionText">Soru yükleniyor...</div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </div>

  <!-- Kuşatma Tahmin Modal -->
  <div class="modal-overlay" id="guessModal">
    <div class="modal-card">
      <div class="category-tag">Kıta Kuşatması: En Yakın Tahmin</div>
      <div class="question-text" id="guessQuestionText">Soru...</div>
      <div class="guess-input-group">
        <input type="number" id="guessInput" class="guess-input" placeholder="Yıl / Sayı">
        <button class="btn-submit" onclick="submitGuess()">Kuşat</button>
      </div>
    </div>
  </div>

  <!-- Reklam Simülasyonu -->
  <div class="modal-overlay" id="adModal">
    <div class="modal-card ad-card">
      <h3 style="color: #f59e0b; font-size: 20px;">ÖDÜLLÜ REKLAM SİMÜLASYONU</h3>
      <p style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">
        (CrazyGames / AdinPlay SDK ile dolar kazandırır)
      </p>
      <div class="ad-timer" id="adTimer">5</div>
    </div>
  </div>

  <script>
    /* Web Audio API Ses Motoru */
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? '🔊 Ses: Açık' : '🔇 Ses: Kapalı';
    }

    function playClickSound() {
      if (!audioEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(460, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSuccessSound() {
      if (!audioEnabled) return;
      initAudio();
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.2);
      });
    }

    function playFailSound() {
      if (!audioEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playConquestSound() {
      if (!audioEnabled) return;
      initAudio();
      [440, 554.37, 659.25, 880].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.12);
        osc.stop(audioCtx.currentTime + idx * 0.12 + 0.4);
      });
    }

    /* Oyun Durumu */
    let tickets = 3;
    let selectedContinentId = null;
    let timerInterval = null;
    let timeLeft = 10;

    // 6 Kıta: 3 (Avrupa) ve 5 (Asya) Oyuncuda (Mavi)
    const continentOwners = {
      1: 'bot1',   // K. Amerika (Kırmızı)
      2: 'bot1',   // G. Amerika (Kırmızı)
      3: 'player', // Avrupa (Mavi)
      4: 'bot2',   // Afrika (Yeşil)
      5: 'player', // Asya (Mavi)
      6: 'bot2'    // Okyanusya (Yeşil)
    };

    const triviaPool = [
      { category: 'Tarih', question: 'Kıbrıs hangi yılda Osmanlı yönetimine geçmiştir?', options: ['1453', '1571', '1683', '1492'], answer: 1 },
      { category: 'Tarih', question: 'Çanakkale Boğazı Deniz Zaferi hangi tarihte kazanılmıştır?', options: ['18 Mart 1915', '29 Ekim 1923', '30 Ağustos 1922', '19 Mayıs 1919'], answer: 0 },
      { category: 'Coğrafya', question: 'Yüzölçümü bakımından dünyanın en büyük kıtası hangisidir?', options: ['Afrika', 'Asya', 'Kuzey Amerika', 'Avrupa'], answer: 1 },
      { category: 'Coğrafya', question: 'Dünyanın en uzun sıradağlar zinciri hangisidir?', options: ['Himalayalar', 'And Dağları', 'Alpler', 'Kayalık Dağlar'], answer: 1 },
      { category: 'Bilim', question: 'Periyodik tabloda "Au" sembolü hangi elementi temsil eder?', options: ['Gümüş', 'Altın', 'Bakır', 'Demir'], answer: 1 },
      { category: 'Spor', question: 'FIFA Dünya Kupası\'nı en çok kazanan ülke hangisidir?', options: ['Almanya', 'İtalya', 'Brezilya', 'Arjantin'], answer: 2 }
    ];

    const guessPool = [
      { question: 'Ay\'a ilk insan hangi yılda ayak basmıştır?', answer: 1969 },
      { question: 'Titanik gemisi hangi yılda batmıştır?', answer: 1912 },
      { question: 'İstanbul hangi yılda fethedilmiştir?', answer: 1453 },
      { question: 'Amerika kıtası Kristof Kolomb tarafından hangi yılda keşfedilmiştir?', answer: 1492 }
    ];

    function handleContinentClick(id) {
      playClickSound();
      if (continentOwners[id] === 'player') {
        alert('Bu kıta zaten sizin hakimiyetinizde!');
        return;
      }

      if (tickets <= 0) {
        alert('Sefer biletiniz kalmadı! Reklam izleyerek yeni bilet alabilirsiniz.');
        return;
      }

      selectedContinentId = id;
      tickets--;
      updateUI();
      startConquestFlow();
    }

    function startConquestFlow() {
      const wheelModal = document.getElementById('wheelModal');
      const wheel = document.getElementById('wheel');
      wheelModal.style.display = 'flex';

      const randomDeg = 1440 + Math.floor(Math.random() * 360);
      wheel.style.transform = `rotate(${randomDeg}deg)`;

      setTimeout(() => {
        wheelModal.style.display = 'none';
        wheel.style.transform = 'rotate(0deg)';
        if (Math.random() > 0.4) {
          openTriviaModal();
        } else {
          openGuessModal();
        }
      }, 3500);
    }

    function openTriviaModal() {
      const modal = document.getElementById('triviaModal');
      const randomQ = triviaPool[Math.floor(Math.random() * triviaPool.length)];
      
      document.getElementById('categoryLabel').innerText = randomQ.category;
      document.getElementById('questionText').innerText = randomQ.question;
      
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      randomQ.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(btn, index === randomQ.answer);
        grid.appendChild(btn);
      });

      modal.style.display = 'flex';
      startTimer(() => {
        playFailSound();
        alert('Süre tükendi! Kuşatma püskürtüldü.');
        modal.style.display = 'none';
      });
    }

    function selectOption(button, isCorrect) {
      clearInterval(timerInterval);
      if (isCorrect) {
        playSuccessSound();
        button.classList.add('correct');
        setTimeout(() => {
          conquerContinent(selectedContinentId);
          document.getElementById('triviaModal').style.display = 'none';
        }, 900);
      } else {
        playFailSound();
        button.classList.add('wrong');
        setTimeout(() => {
          alert('Yanlış cevap! Kıta savunması galip geldi.');
          document.getElementById('triviaModal').style.display = 'none';
        }, 900);
      }
    }

    let currentGuessQ = null;
    function openGuessModal() {
      currentGuessQ = guessPool[Math.floor(Math.random() * guessPool.length)];
      document.getElementById('guessQuestionText').innerText = currentGuessQ.question;
      document.getElementById('guessInput').value = '';
      document.getElementById('guessModal').style.display = 'flex';
    }

    function submitGuess() {
      playClickSound();
      const userVal = parseInt(document.getElementById('guessInput').value);
      if (isNaN(userVal)) return;

      const botOffset = (Math.floor(Math.random() * 25) - 12);
      const botVal = currentGuessQ.answer + (botOffset === 0 ? 6 : botOffset);
      const userDiff = Math.abs(userVal - currentGuessQ.answer);
      const botDiff = Math.abs(botVal - currentGuessQ.answer);

      let msg = `Gerçek Tarih: ${currentGuessQ.answer}\nSenin Tahminin: ${userVal}\nSavunan Krallık: ${botVal}\n\n`;

      if (userDiff <= botDiff) {
        playSuccessSound();
        msg += 'Daha yakın tahmin ettiniz! Kıta fethedildi!';
        alert(msg);
        conquerContinent(selectedContinentId);
      } else {
        playFailSound();
        msg += 'Düşman daha yakın tahmin yaptı. Kuşatma başarısız!';
        alert(msg);
      }
      document.getElementById('guessModal').style.display = 'none';
    }

    function conquerContinent(id) {
      playConquestSound();
      continentOwners[id] = 'player';
      const el = document.getElementById('c' + id);
      el.setAttribute('fill', '#2563eb');
      updateUI();
      checkWinCondition();
    }

    function startTimer(onTimeout) {
      clearInterval(timerInterval);
      timeLeft = 10;
      const fill = document.getElementById('timerFill');
      fill.style.width = '100%';

      timerInterval = setInterval(() => {
        timeLeft--;
        fill.style.width = (timeLeft * 10) + '%';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          onTimeout();
        }
      }, 1000);
    }

    function openRewardedAd() {
      playClickSound();
      const adModal = document.getElementById('adModal');
      const timerEl = document.getElementById('adTimer');
      let countdown = 5;
      
      adModal.style.display = 'flex';
      timerEl.innerText = countdown;

      const adInterval = setInterval(() => {
        countdown--;
        timerEl.innerText = countdown;
        if (countdown <= 0) {
          clearInterval(adInterval);
          adModal.style.display = 'none';
          tickets = Math.min(tickets + 1, 5);
          updateUI();
          playSuccessSound();
          alert('Ödül Teslim Edildi: +1 Bilet krallığınıza eklendi!');
        }
      }, 1000);
    }

    function updateUI() {
      document.getElementById('ticketCount').innerText = `${tickets}/3`;
      let count = 0;
      for (let k in continentOwners) {
        if (continentOwners[k] === 'player') count++;
      }
      document.getElementById('territoryCount').innerText = `${count}/6 Kıta`;
    }

    function checkWinCondition() {
      const allPlayer = Object.values(continentOwners).every(v => v === 'player');
      if (allPlayer) {
        playConquestSound();
        alert('KÜRESEL ZAFER! Bütün dünyayı fethettiniz ve tek cihan hükümdarı oldunuz!');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trivia Kingdoms: Global Conquest</title>
  <style>
    :root {
      --bg-dark: #070d18;
      --card-bg: #111a2e;
      --panel-border: #1e2c4a;
      --accent-blue: #38bdf8;
      --accent-gold: #f59e0b;
      --player-color: #2563eb;
      --bot1-color: #dc2626;
      --bot2-color: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --ocean-color: #081120;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #172554 0%, var(--bg-dark) 85%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 1000px;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(17, 26, 46, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--panel-border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      background: rgba(7, 13, 24, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--panel-border);
    }

    .btn-ad {
      background: linear-gradient(135deg, #10b981, #047857);
      color: white;
      border: 1px solid #34d399;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
      transition: all 0.2s;
    }
    .btn-ad:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }

    main {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 16px;
    }

    .map-container {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7);
      border: 1px solid var(--panel-border);
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .map-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .audio-toggle {
      background: none;
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    svg {
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--ocean-color);
      border-radius: 14px;
      border: 1px solid #1e293b;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }

    .territory {
      transition: fill 0.35s ease, filter 0.2s, stroke 0.2s;
      cursor: pointer;
      stroke: #070d18;
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    .territory:hover {
      filter: brightness(1.3) drop-shadow(0 0 10px rgba(255,255,255,0.4));
    }

    .castle-icon {
      pointer-events: none;
      fill: #ffffff;
      opacity: 0.95;
    }

    .territory-label {
      pointer-events: none;
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
    }

    /* Modal Arayüzleri */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 16, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 26px;
      width: 100%;
      max-width: 490px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 25px 50px rgba(0,0,0,0.85);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .wheel-container {
      position: relative;
      width: 210px;
      height: 210px;
      margin: 8px auto;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid var(--accent-gold);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.35);
      transition: transform 3.5s cubic-bezier(0.12, 0.95, 0.2, 1);
      background: conic-gradient(
        #ef4444 0deg 72deg,
        #3b82f6 72deg 144deg,
        #10b981 144deg 216deg,
        #f59e0b 216deg 288deg,
        #8b5cf6 288deg 360deg
      );
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid #ffffff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
      z-index: 10;
    }

    .timer-bar {
      width: 100%;
      height: 8px;
      background: #070d18;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 1s linear;
    }

    .category-tag {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.45;
      min-height: 52px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      background: rgba(7, 13, 24, 0.6);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn:hover {
      background: #1e293b;
      border-color: var(--accent-blue);
      transform: translateX(4px);
    }

    .option-btn.correct { background: #059669 !important; border-color: #34d399 !important; }
    .option-btn.wrong { background: #dc2626 !important; border-color: #f87171 !important; }

    .guess-input-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
    }

    .guess-input {
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
      background: #070d18;
      border: 2px solid var(--panel-border);
      border-radius: 10px;
      color: white;
      text-align: center;
      width: 150px;
      outline: none;
    }

    .btn-submit {
      background: var(--accent-blue);
      color: #070d18;
      font-weight: 800;
      font-size: 15px;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
    }

    .ad-card {
      background: #020617;
      border: 2px dashed #f59e0b;
      padding: 35px 20px;
    }

    .ad-timer {
      font-size: 32px;
      font-weight: 900;
      color: var(--accent-gold);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="stat-badge">
      <span>🎫 Biletler:</span>
      <span id="ticketCount" style="color: var(--accent-blue);">3/3</span>
    </div>
    <button class="btn-ad" onclick="openRewardedAd()">
      <span>▶ Reklam İzle (+1 Bilet)</span>
    </button>
    <div class="stat-badge">
      <span>🌐 Mavi Kıtalar:</span>
      <span id="territoryCount" style="color: var(--accent-gold);">2/7</span>
    </div>
  </header>

  <main>
    <div class="map-container">
      <div class="map-header">
        <div class="map-title">Dünya Hakimiyeti: Fethetmek İstediğiniz Kıtayı Seçin</div>
        <button class="audio-toggle" onclick="toggleAudio()" id="audioBtn">🔊 Ses: Açık</button>
      </div>

      <!-- 7 Kıtadan Oluşan Dünya Haritası -->
      <svg viewBox="0 0 850 480" id="gameMap">
        <defs>
          <g id="castle">
            <path d="M-9,-7 h3 v3 h3 v-3 h3 v3 h3 v-3 h3 v14 h-18 z" />
          </g>
        </defs>

        <!-- 1. KUZEY AMERİKA (Kırmızı) -->
        <polygon id="t1" class="territory" points="70,50 250,45 280,120 230,195 180,215 130,230 145,175 60,110" fill="#dc2626" onclick="handleTerritoryClick(1)"></polygon>

        <!-- 2. GÜNEY AMERİKA (Kırmızı) -->
        <polygon id="t2" class="territory" points="190,240 270,250 290,320 240,420 200,430 180,330" fill="#dc2626" onclick="handleTerritoryClick(2)"></polygon>

        <!-- 3. AVRUPA (Oyuncu - Mavi) -->
        <polygon id="t3" class="territory" points="360,65 470,60 480,140 435,175 375,175 345,120" fill="#2563eb" onclick="handleTerritoryClick(3)"></polygon>

        <!-- 4. AFRİKA (Yeşil) -->
        <polygon id="t4" class="territory" points="365,190 485,190 520,270 480,380 410,385 370,280" fill="#059669" onclick="handleTerritoryClick(4)"></polygon>

        <!-- 5. ORTA DOĞU & ORTA ASYA (Oyuncu - Mavi) -->
        <polygon id="t5" class="territory" points="475,135 600,125 615,240 535,260 480,220 440,175" fill="#2563eb" onclick="handleTerritoryClick(5)"></polygon>

        <!-- 6. DOĞU ASYA & SİBİRYA (Yeşil) -->
        <polygon id="t6" class="territory" points="470,55 770,50 780,140 730,235 620,230 595,125" fill="#059669" onclick="handleTerritoryClick(6)"></polygon>

        <!-- 7. OKYANUSYA / AVUSTRALYA (Kırmızı) -->
        <polygon id="t7" class="territory" points="660,300 780,310 790,395 720,425 640,370" fill="#dc2626" onclick="handleTerritoryClick(7)"></polygon>

        <!-- Kaleler -->
        <use href="#castle" x="160" y="115" class="castle-icon" />
        <use href="#castle" x="235" y="320" class="castle-icon" />
        <use href="#castle" x="410" y="105" class="castle-icon" />
        <use href="#castle" x="440" y="275" class="castle-icon" />
        <use href="#castle" x="525" y="180" class="castle-icon" />
        <use href="#castle" x="670" y="130" class="castle-icon" />
        <use href="#castle" x="715" y="355" class="castle-icon" />

        <!-- Kıta İsimleri -->
        <text x="160" y="140" text-anchor="middle" class="territory-label">Kuzey Amerika</text>
        <text x="235" y="345" text-anchor="middle" class="territory-label">Güney Amerika</text>
        <text x="410" y="130" text-anchor="middle" class="territory-label">Avrupa</text>
        <text x="440" y="300" text-anchor="middle" class="territory-label">Afrika</text>
        <text x="525" y="205" text-anchor="middle" class="territory-label">Orta Doğu & Avrasya</text>
        <text x="670" y="155" text-anchor="middle" class="territory-label">Asya Pasifik</text>
        <text x="715" y="380" text-anchor="middle" class="territory-label">Okyanusya</text>
      </svg>
    </div>
  </main>

  <!-- Çark Modal -->
  <div class="modal-overlay" id="wheelModal">
    <div class="modal-card">
      <h3 style="font-size: 20px; font-weight: 800;">Kıta Savaşı Başlıyor</h3>
      <div class="wheel-container">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel"></div>
      </div>
      <p style="color: var(--text-muted); font-size: 14px;">Kader çarkı dönüyor...</p>
    </div>
  </div>

  <!-- Soru Modal -->
  <div class="modal-overlay" id="triviaModal">
    <div class="modal-card">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="category-tag" id="categoryLabel">Tarih</div>
      <div class="question-text" id="questionText">Soru yükleniyor...</div>
      <div class="options-grid" id="optionsGrid"></div>
    </div>
  </div>

  <!-- Kuşatma Tahmin Modal -->
  <div class="modal-overlay" id="guessModal">
    <div class="modal-card">
      <div class="category-tag">Kıta Kuşatması: En Yakın Tahmin</div>
      <div class="question-text" id="guessQuestionText">Soru...</div>
      <div class="guess-input-group">
        <input type="number" id="guessInput" class="guess-input" placeholder="Yıl / Sayı">
        <button class="btn-submit" onclick="submitGuess()">Kuşat</button>
      </div>
    </div>
  </div>

  <!-- Reklam Simülasyonu -->
  <div class="modal-overlay" id="adModal">
    <div class="modal-card ad-card">
      <h3 style="color: #f59e0b;">ÖDÜLLÜ REKLAM SİMÜLASYONU</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 6px;">
        (CrazyGames / AdinPlay SDK bağlandığında dolar kazandırır)
      </p>
      <div class="ad-timer" id="adTimer">5</div>
    </div>
  </div>

  <script>
    /* Ses Motoru */
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? '🔊 Ses: Açık' : '🔇 Ses: Kapalı';
    }

    function playClickSound() {
      if (!audioEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(460, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playSuccessSound() {
      if (!audioEnabled) return;
      initAudio();
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.08);
        osc.stop(audioCtx.currentTime + idx * 0.08 + 0.2);
      });
    }

    function playFailSound() {
      if (!audioEnabled) return;
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playConquestSound() {
      if (!audioEnabled) return;
      initAudio();
      [440, 554.37, 659.25, 880].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.12);
        osc.stop(audioCtx.currentTime + idx * 0.12 + 0.4);
      });
    }

    /* Oyun Durumu */
    let tickets = 3;
    let selectedTerritoryId = null;
    let timerInterval = null;
    let timeLeft = 10;

    // 7 Kıta Mülkiyeti: 3 ve 5 Oyuncunun (Mavi)
    const territoryOwners = {
      1: 'bot1',   // K. Amerika
      2: 'bot1',   // G. Amerika
      3: 'player', // Avrupa
      4: 'bot2',   // Afrika
      5: 'player', // Avrasya
      6: 'bot2',   // Asya Pasifik
      7: 'bot1'    // Okyanusya
    };

    const triviaPool = [
      { category: 'Tarih', question: 'Kıbrıs hangi yılda Osmanlı yönetimine geçmiştir?', options: ['1453', '1571', '1683', '1492'], answer: 1 },
      { category: 'Tarih', question: 'Çanakkale Boğazı Deniz Zaferi hangi tarihte kazanılmıştır?', options: ['18 Mart 1915', '29 Ekim 1923', '30 Ağustos 1922', '19 Mayıs 1919'], answer: 0 },
      { category: 'Coğrafya', question: 'Dünyanın en uzun nehri hangisidir?', options: ['Amazon Nehri', 'Nil Nehri', 'Yangtze', 'Mississippi'], answer: 1 },
      { category: 'Coğrafya', question: 'Yüzölçümü bakımından dünyanın en büyük kıtası hangisidir?', options: ['Afrika', 'Asya', 'Kuzey Amerika', 'Avrupa'], answer: 1 },
      { category: 'Bilim', question: 'Periyodik tabloda "Au" sembolü hangi elementi temsil eder?', options: ['Gümüş', 'Altın', 'Bakır', 'Demir'], answer: 1 },
      { category: 'Spor', question: 'FIFA Dünya Kupası\'nı en çok kazanan ülke hangisidir?', options: ['Almanya', 'İtalya', 'Brezilya', 'Arjantin'], answer: 2 }
    ];

    const guessPool = [
      { question: 'Ay\'a ilk insan hangi yılda ayak basmıştır?', answer: 1969 },
      { question: 'Titanik gemisi hangi yılda batmıştır?', answer: 1912 },
      { question: 'İstanbul hangi yılda fethedilmiştir?', answer: 1453 },
      { question: 'Amerika kıtası Kristof Kolomb tarafından hangi yılda keşfedilmiştir?', answer: 1492 }
    ];

    function handleTerritoryClick(id) {
      playClickSound();
      if (territoryOwners[id] === 'player') {
        alert('Bu kıta zaten sizin hakimiyetinizde!');
        return;
      }

      if (tickets <= 0) {
        alert('Biletiniz bitti! Reklam izleyerek yeni sefer bileti alabilirsiniz.');
        return;
      }

      selectedTerritoryId = id;
      tickets--;
      updateUI();
      startConquestFlow();
    }

    function startConquestFlow() {
      const wheelModal = document.getElementById('wheelModal');
      const wheel = document.getElementById('wheel');
      wheelModal.style.display = 'flex';

      const randomDeg = 1440 + Math.floor(Math.random() * 360);
      wheel.style.transform = `rotate(${randomDeg}deg)`;

      setTimeout(() => {
        wheelModal.style.display = 'none';
        wheel.style.transform = 'rotate(0deg)';
        if (Math.random() > 0.4) {
          openTriviaModal();
        } else {
          openGuessModal();
        }
      }, 3500);
    }

    function openTriviaModal() {
      const modal = document.getElementById('triviaModal');
      const randomQ = triviaPool[Math.floor(Math.random() * triviaPool.length)];
      
      document.getElementById('categoryLabel').innerText = randomQ.category;
      document.getElementById('questionText').innerText = randomQ.question;
      
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      randomQ.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(btn, index === randomQ.answer);
        grid.appendChild(btn);
      });

      modal.style.display = 'flex';
      startTimer(() => {
        playFailSound();
        alert('Süre tükendi! Sefer başarısız oldu.');
        modal.style.display = 'none';
      });
    }

    function selectOption(button, isCorrect) {
      clearInterval(timerInterval);
      if (isCorrect) {
        playSuccessSound();
        button.classList.add('correct');
        setTimeout(() => {
          conquerTerritory(selectedTerritoryId);
          document.getElementById('triviaModal').style.display = 'none';
        }, 900);
      } else {
        playFailSound();
        button.classList.add('wrong');
        setTimeout(() => {
          alert('Yanlış cevap! Kıta fethedilemedi.');
          document.getElementById('triviaModal').style.display = 'none';
        }, 900);
      }
    }

    let currentGuessQ = null;
    function openGuessModal() {
      currentGuessQ = guessPool[Math.floor(Math.random() * guessPool.length)];
      document.getElementById('guessQuestionText').innerText = currentGuessQ.question;
      document.getElementById('guessInput').value = '';
      document.getElementById('guessModal').style.display = 'flex';
    }

    function submitGuess() {
      playClickSound();
      const userVal = parseInt(document.getElementById('guessInput').value);
      if (isNaN(userVal)) return;

      const botOffset = (Math.floor(Math.random() * 25) - 12);
      const botVal = currentGuessQ.answer + (botOffset === 0 ? 6 : botOffset);
      const userDiff = Math.abs(userVal - currentGuessQ.answer);
      const botDiff = Math.abs(botVal - currentGuessQ.answer);

      let msg = `Gerçek Cevap: ${currentGuessQ.answer}\nSizin Tahmininiz: ${userVal}\nSavunan Krallık: ${botVal}\n\n`;

      if (userDiff <= botDiff) {
        playSuccessSound();
        msg += 'Daha yakın tahmin! Kıta fethedildi!';
        alert(msg);
        conquerTerritory(selectedTerritoryId);
      } else {
        playFailSound();
        msg += 'Düşman daha yakın tahmin etti. Kuşatma kırıldı!';
        alert(msg);
      }
      document.getElementById('guessModal').style.display = 'none';
    }

    function conquerTerritory(id) {
      playConquestSound();
      territoryOwners[id] = 'player';
      const el = document.getElementById('t' + id);
      el.setAttribute('fill', '#2563eb');
      updateUI();
      checkWinCondition();
    }

    function startTimer(onTimeout) {
      clearInterval(timerInterval);
      timeLeft = 10;
      const fill = document.getElementById('timerFill');
      fill.style.width = '100%';

      timerInterval = setInterval(() => {
        timeLeft--;
        fill.style.width = (timeLeft * 10) + '%';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          onTimeout();
        }
      }, 1000);
    }

    function openRewardedAd() {
      playClickSound();
      const adModal = document.getElementById('adModal');
      const timerEl = document.getElementById('adTimer');
      let countdown = 5;
      
      adModal.style.display = 'flex';
      timerEl.innerText = countdown;

      const adInterval = setInterval(() => {
        countdown--;
        timerEl.innerText = countdown;
        if (countdown <= 0) {
          clearInterval(adInterval);
          adModal.style.display = 'none';
          tickets = Math.min(tickets + 1, 5);
          updateUI();
          playSuccessSound();
          alert('Ödül Teslim Edildi: +1 Bilet hesabınıza eklendi!');
        }
      }, 1000);
    }

    function updateUI() {
      document.getElementById('ticketCount').innerText = `${tickets}/3`;
      let count = 0;
      for (let k in territoryOwners) {
        if (territoryOwners[k] === 'player') count++;
      }
      document.getElementById('territoryCount').innerText = `${count}/7`;
    }

    function checkWinCondition() {
      const allPlayer = Object.values(territoryOwners).every(v => v === 'player');
      if (allPlayer) {
        playConquestSound();
        alert('DÜNYA HAKİMİYETİ! Bütün kıtaları fethettiniz ve küresel imparator oldunuz!');
      }
    }
  </script>
</body>
</html>
